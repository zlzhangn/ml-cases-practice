[project]
name = "ml-cases-practice"
version = "0.1.0"
description = "通过真实案例掌握机器学习实战能力"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "polars>=0.20",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "shap>=0.44",
    "mlflow>=2.10",
    "optuna>=3.4",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.18",
    "pyyaml>=6.0",
    "jupyter>=1.0",
    "notebook>=7.0",
    "imbalanced-learn>=0.12",
    "feature-engine>=1.6",
    "datasets>=4.8.5",
]

[project.optional-dependencies]
cases = [
    "prophet>=1.1",
    "statsmodels>=0.14",
    "pyod>=1.1",
    "econml>=0.15",
    "transformers>=4.38",
    "sentence-transformers>=2.5",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = ["E501", "N803", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
