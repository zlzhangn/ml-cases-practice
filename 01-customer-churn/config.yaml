# 案例 1：客户流失预测 — 专属配置

project:
  name: 01-customer-churn
  version: "0.1.0"
  random-seed: 42

paths:
  data-dir: ./data
  outputs-dir: ./outputs
  mlruns-dir: ./mlruns
  cache-dir: ./.cache

data:
  dataset-name: "aai510-group1/telco-customer-churn"
  target-col: "Churn"
  id-col: "customerID"
  test-size: 0.2
  stratify: true
  shuffle: true

preprocessing:
  # 数值列中的特殊缺失值标记
  missing-placeholder: " "
  # 需要转换为数值的列（原始为字符串数字）
  numeric-like-cols:
    - "TotalCharges"
    - "MonthlyCharges"
    - "tenure"
  # 二元类别列（是/否类型）
  binary-cols:
    - "Partner"
    - "Dependents"
    - "PhoneService"
    - "PaperlessBilling"
    - "Churn"
  # 多元类别列
  multi-category-cols:
    - "gender"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"
    - "Contract"
    - "PaymentMethod"

features:
  # 低基数类别列使用 One-Hot 编码（基数 <= 5）
  onehot-max-categories: 5
  # 数值特征标准化
  scale-numeric: true

model:
  logistic-regression:
    max_iter: 1000
    random_state: 42
    n_jobs: -1
    class_weight: "balanced"
  
  lightgbm:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    verbose: -1
    class_weight: "balanced"

training:
  cv-folds: 5
  early-stopping-rounds: 50
  eval-metric: auc

evaluation:
  classification-metrics:
    - accuracy
    - precision
    - recall
    - f1
    - auc
  shap-sample-size: 500

mlflow:
  experiment-name: "01-customer-churn"
  tracking-uri: null

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
